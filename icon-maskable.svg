           C 18 22.5, 21.5 21.4, 24 23.8
           C 26.4 26.2, 24.8 29.5, 28.2 29.1
           C 31.5 28.7, 32.4 24.7, 35.6 24
           C 37.2 23.7, 38.4 23.7, 39.6 24.1"
        fill="none" stroke="#1e3a5f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 红笔波浪批注下划线 -->
  <path d="M21.5 30.5 Q 23.2 29.3, 24.9 30.5 T 28.3 30.5 T 31.7 30.5" fill="none" stroke="#c0564e" stroke-width="1.7" stroke-linecap="round"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- maskable：纸色满幅出血，内容收在中央 80% 安全区（半径约 19） -->
  <rect width="48" height="48" fill="#fdf6e9"/>

  <!-- 笔记本红左边线 -->
  <line x1="14.5" y1="10" x2="14.5" y2="38" stroke="#e2a8a4" stroke-width="1.7" stroke-linecap="round"/>

  <!-- 淡蓝横线 -->
  <line x1="18.5" y1="18" x2="36.5" y2="18" stroke="#b9cede" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="18.5" y1="32" x2="36.5" y2="32" stroke="#b9cede" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>

  <!-- 墨蓝手写主笔迹 -->
